      subscriptions:
        required:
          - { rooms: ["#swarm-curator:relux.works", "#curator:relux.works", "#swarm-lobby:relux.works", "#lobby:relux.works", "#curator-migration:relux.works"], kinds: [system, owner-needed, decision] }
          - { from_mxid: "@alexis:relux.works" }
        self: []
