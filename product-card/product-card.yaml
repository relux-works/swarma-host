    id: gha-runner_orch
    project: gha-runner-m1max
    desired_state_ref: "Owner park relayed by Meta, 2026-10-27 ($7ZKERa7hDHTFTWWMz_uF0Ujv82FhCElGWQ2QPlX1Tjg)"
    clone: ../../gha-runner-m1max
    a2a:
      connection: relux
      parent_route: "#swarm-gha-runner"
      rooms: ["#swarm-gha-runner", "#swarm-lobby", "#lobby"]
      subscriptions:
        required:
          - { rooms: ["#swarm-gha-runner", "#swarm-lobby", "#lobby"], kinds: [system, owner-needed, decision] }
          - { from_mxid: "@alexis:relux.works" }
        self: []
    staffing: []
  - <<: *orch
    id: remote-workplace_orch
    project: remote-workplace
    desired_state_ref: "Owner park relayed by Meta, 2026-10-27 ($7ZKERa7hDHTFTWWMz_uF0Ujv82FhCElGWQ2QPlX1Tjg)"
    clone: ../../remote-workplace
    a2a:
      connection: relux
      parent_route: "#swarm-remote-workplace"
      rooms: ["#swarm-remote-workplace", "#swarm-lobby", "#lobby"]
      subscriptions:
        required:
          - { rooms: ["#swarm-remote-workplace", "#swarm-lobby", "#lobby"], kinds: [system, owner-needed, decision] }
          - { from_mxid: "@alexis:relux.works" }
        self: []
    staffing: []
